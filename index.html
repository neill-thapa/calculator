<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h1>Basic Calculator</h1>

    <p>
        Operation: <span id="displayOperations"></span>
    </p>
    <p>
        Result: <span id="displayResults"></span>
    </p>
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>0</button>
    <button>.</button>
    <button>+</button>
    <button>-</button>
    <button>×</button>
    <button>÷</button>
    <button>=</button>
    <button>+/-</button>
    <button>⌫</button>
    <button>Clear</button>

    <script src="./script.js"></script>
</body>
</html>
